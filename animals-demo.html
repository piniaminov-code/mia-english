let round=0,wins=0,run=0,busy=false,active=false,paused=false,lastMode='intro';const player=new Audio();player.preload='auto';player.playsInline=true;const urls={};let finishAudio=null;

function sliceRect(){const r=world.getBoundingClientRect(),ca=r.width/r.height,ia=1000/650;let vw,vh,x0,y0;if(ca>=ia){vw=1000;vh=1000/ca;x0=0;y0=(650-vh)/2;}else{vh=650;vw=650*ca;x0=(1000-vw)/2;y0=0;}return{r,vw,vh,x0,y0};}
function scenePct(sx,sy){const s=sliceRect();return{x:(sx-s.x0)/s.vw*100,b:(s.y0+s.vh-sy)/s.vh*100};}
function millyScenePos(){const s=sliceRect(),g=lily.getBoundingClientRect();return{x:(g.left+g.width/2-s.r.left)/s.r.width*s.vw+s.x0,y:s.y0+s.vh*(1-(s.r.bottom-(g.top+g.height*.966))/s.r.height)};}
function scaleAt(y){return Math.max(.5,Math.min(1,.55+(y-380)/270*.45));}
let playBall=null;function depthSort(){const g=lily.getBoundingClientRect(),feet=g.top+g.height*.966;document.querySelectorAll('.animal:not(.dogb)').forEach(b=>{const r=b.getBoundingClientRect(),base=r.top+r.height*.97;b.style.zIndex=(b!==playBall&&base>feet)?5:3;});}function clearDepth(){playBall=null;document.querySelectorAll('.animal:not(.dogb)').forEach(b=>b.style.zIndex='');}function placeMilly(sx,sy){const p=scenePct(sx,sy),w=(matchMedia('(max-width:650px)').matches?38:24)*scaleAt(sy);lily.style.width=w+'%';lily.style.left=(p.x-w/2)+'%';lily.style.bottom=p.b+'%';depthSort();}
function waitResume(id){return new Promise(res=>{(function chk(){if(id!==run)return res(false);if(!paused)return res(true);setTimeout(chk,120);})();});}
function abortWalk(){clearDepth();lily.classList.remove('walking','playing');document.getElementById('miliFlip').classList.remove('rev');if(paused){lily.style.width=lily.style.left=lily.style.bottom='';miliImg.src=MILLY_FRAMES.base;}}
async function walkPath(id,pts){if(pts.length<2)return true;lily.classList.add('walking');depthSort();let seg=0,d=0,gd=0,last=performance.now();const flip=document.getElementById('miliFlip');while(seg<pts.length-1){if(id!==run){abortWalk();return false;}if(paused){if(!await waitResume(id)){abortWalk();return false;}last=performance.now();continue;}const now=performance.now(),dt=Math.min(250,now-last)/1000;last=now;const x1=pts[seg][0],y1=pts[seg][1],x2=pts[seg+1][0],y2=pts[seg+1][1],len=Math.hypot(x2-x1,y2-y1)||1;d+=215*dt;gd+=215*dt;if(d>=len){seg++;d=0;continue;}const t=d/len;placeMilly(x1+(x2-x1)*t,y1+(y2-y1)*t);flip.classList.toggle('rev',x2<x1);miliImg.src=WALKF[Math.floor(gd/30)%4];await new Promise(r=>setTimeout(r,33));}lily.classList.remove('walking');return true;}

const mob=()=>matchMedia('(max-width:650px)').matches;
let ROUTES={};
function layout(){const s=sliceRect(),m=mob(),X=f=>s.x0+s.vw*f,Y=y=>Math.min(y,s.y0+s.vh-14);
 const c={x:X(m?.80:.76),y:Y(m?606:600)},b={x:X(m?.56:.42),y:Y(m?470:450)};
 [[CAT,c],[BIRD,b]].forEach(([el,p])=>{const q=scenePct(p.x,p.y);el.style.left=q.x+'%';el.style.bottom=q.b+'%';});
 ROUTES={cat:[[c.x-(m?165:190),Y(c.y+2)]],bird:[[X(m?.36:.30),Y(m?600:604)],[b.x-(m?150:160),Y(b.y+34)]]};}
layout();addEventListener('resize',()=>{if(!lily.classList.contains('walking'))layout();});
function setHappy(el,on){el.classList.toggle('happy',on);}
async function playAt(el,id,ms){lily.classList.add('playing');playBall=el;depthSort();miliImg.src=PLAYF;el.classList.add('bump');let left=ms,flap=0;while(left>0){if(id!==run){abortWalk();el.classList.remove('bump');return false;}if(paused){if(!await waitResume(id)){abortWalk();el.classList.remove('bump');return false;}continue;}if(el===BIRD){setHappy(el,(flap++%2)===0);}const step=Math.min(240,left);await new Promise(r=>setTimeout(r,step));left-=step;}el.classList.remove('bump');lily.classList.remove('playing');playBall=null;return true;}
async function backHome(id,to){if(!await walkPath(id,to.slice().reverse()))return false;document.getElementById('miliFlip').classList.remove('rev');miliImg.src=MILLY_FRAMES.base;clearDepth();return true;}
async function visit(el,id,ms){if(reduceMotion)return true;const route=ROUTES[el.dataset.animal];if(!route)return true;const home=millyScenePos(),to=[[home.x,home.y]].concat(route);if(!await walkPath(id,to))return false;if(!await playAt(el,id,ms))return false;return backHome(id,to);}
function react(c,ms){lily.classList.remove('happy','tilt');void lily.offsetWidth;lily.classList.add(c);setTimeout(()=>lily.classList.remove(c),ms);}
function enable(on){document.querySelectorAll('.animal').forEach(b=>b.disabled=!on);}
async function lines(keys,id){for(const k of keys){if(id!==run||paused)return false;if(!await clip(k,id)){if(id===run&&!paused){hint.textContent='השמע לא התחיל. לחצי על כפתור השמע וננסה שוב.';busy=false;enable(false);}return false;}}return id===run&&!paused;}
function setPrompt(){prompt.innerHTML='איפה הכדור שבצבע <span class="en" lang="en">'+order[round]+'</span> ?';hint.textContent='הקשיבי, ואז געי בכדור.';}
async function ask(){const id=++run;busy=true;enable(false);lastMode='question';setPrompt();if(await lines(['he/where_ball_'+order[round]],id)){busy=false;enable(true);}}
function sparkle(el){const r=el.getBoundingClientRect(),w=world.getBoundingClientRect();for(let n=0;n<10;n++){const s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.left=(r.left-w.left+r.width/2)+'px';s.style.top=(r.top-w.top+r.height/2)+'px';s.style.setProperty('--dx',((n-4.5)*22)+'px');s.style.setProperty('--dy',(-50-Math.random()*90)+'px');world.append(s);setTimeout(()=>s.remove(),1500);}}
async function choose(el){if(busy||paused||!active)return;busy=true;enable(false);const id=++run;const a=el.dataset.animal;if(a!==order[round]){el.classList.add('oops');react('tilt',1500);prompt.textContent='עוד ניסיון, אני איתך';hint.textContent='אפשר להקשיב שוב. אין מה למהר.';await lines(['he/wrong'],id);el.classList.remove('oops');if(id===run&&!paused)ask();return;}wins++;world.dataset.wins=String(wins);world.classList.add('correct');el.classList.add('hit');react('happy',1500);sparkle(el);document.querySelectorAll('.steps i')[wins-1].classList.add('on');$('.steps').setAttribute('aria-label',wins+' מתוך שלושה כוכבים');prompt.innerHTML='יפה מאוד! <span class="en" lang="en">'+a+'</span>';hint.textContent='תראי, עוד פרחים התעוררו.';lastMode='success';await lines([PR[Math.floor(Math.random()*5)],'en/'+a],id);el.classList.remove('hit');world.classList.remove('correct');if(id!==run||paused)return;if(!await visitBall(el,id))return;if(paused)return;round++;if(round<3)ask();else complete();}
function complete(){active=false;busy=false;lastMode='complete';enable(false);world.classList.add('completed');prompt.textContent='כל הכבוד!';hint.textContent='שלושה צבעים, שלוש מילים. כל הכבוד מִיָּה!';$('#start').hidden=false;$('#start').textContent='נשחק שוב ↻';$('#pause').hidden=true;lines(['he/finale1','he/finale3'],++run);}

async function teach(a,id){
 const el=EL[a];
 if(a==='dog'){react('happy',2200);if(!await lines(['he/this_dog','he/ineng','en/dog','he/yourturn'],id))return false;await new Promise(r=>setTimeout(r,1800));return id===run&&!paused;}
 const route=ROUTES[a],home=millyScenePos(),to=[[home.x,home.y]].concat(route);
 if(!reduceMotion){if(!await walkPath(id,to))return false;}
 setHappy(el,true);el.classList.add('bump');
 const ok=await lines(['he/this_'+a,'he/ineng','en/'+a,'he/yourturn'],id);
 el.classList.remove('bump');if(!ok)return false;
 if(!reduceMotion){lily.classList.add('playing');playBall=el;depthSort();miliImg.src=PLAYF;el.classList.add('bump');
  let n=0;const t=setInterval(()=>{if(a==='bird')setHappy(el,(n++%2)===0);},240);
  await new Promise(r=>setTimeout(r,2100));clearInterval(t);el.classList.remove('bump');lily.classList.remove('playing');playBall=null;
  if(id!==run||paused){return false;}
  setHappy(el,false);if(!await backHome(id,to))return false;}
 setHappy(el,false);return id===run&&!paused;}
function setPrompt(){prompt.innerHTML='איפה ה<span class="en" lang="en">'+order[round]+'</span> ?';hint.textContent='הקשיבי, ואז געי בחיה.';}
async function ask(){const id=++run;busy=true;enable(false);lastMode='question';setPrompt();if(await lines(['he/where','en/'+order[round]],id)){busy=false;enable(true);}}
async function start(){clearDepth();layout();lily.classList.remove('walking','playing');lily.style.width=lily.style.left=lily.style.bottom='';const f0=document.getElementById('miliFlip');if(f0)f0.classList.remove('rev');order=shuf(['dog','cat','bird']);round=0;wins=0;active=true;paused=false;world.dataset.wins='0';world.classList.remove('completed','paused','correct');$('.pauseveil').hidden=true;document.querySelectorAll('.steps i').forEach(s=>s.classList.remove('on'));$('.steps').setAttribute('aria-label','אפס מתוך שלושה כוכבים');$('#start').hidden=true;$('#replay').hidden=false;$('#pause').hidden=false;lastMode='intro';const id=++run;busy=true;enable(false);prompt.textContent='היי מִיָּה, בואי נכיר חברים!';hint.textContent='מילי כאן איתך. הקשיבי לקול שלה.';
 if(!await lines(['he/intro1'],id))return;
 for(const a of ['dog','cat','bird']){prompt.innerHTML='זה <span class="en" lang="en">'+a+'</span> · '+HE[a];hint.textContent='מילי מראה לך ומשחקת.';if(!await teach(a,id))return;}
 prompt.textContent='עכשיו משחק!';if(!await lines(['he/g1intro2'],id))return;ask();}
async function choose(el){if(busy||paused||!active)return;busy=true;enable(false);const id=++run;const a=el.dataset.animal;
 if(a!==order[round]){if(a!=='dog')el.classList.add('oops');react('tilt',1500);prompt.textContent='עוד ניסיון, אני איתך';hint.textContent='אפשר להקשיב שוב. אין מה למהר.';await lines(['he/wrong'],id);el.classList.remove('oops');if(id===run&&!paused)ask();return;}
 wins++;world.dataset.wins=String(wins);world.classList.add('correct');el.classList.add('hit');react('happy',1500);sparkle(el);document.querySelectorAll('.steps i')[wins-1].classList.add('on');$('.steps').setAttribute('aria-label',wins+' מתוך שלושה כוכבים');prompt.innerHTML='יפה מאוד! <span class="en" lang="en">'+a+'</span>';hint.textContent='מילי שמחה!';lastMode='success';
 await lines([PR[Math.floor(Math.random()*5)],'en/'+a],id);el.classList.remove('hit');world.classList.remove('correct');if(id!==run||paused)return;
 if(a!=='dog'){setHappy(el,true);if(!await visit(el,id,1700)){return;}setHappy(el,false);}
 if(paused)return;round++;if(round<3)ask();else complete();}
function complete(){active=false;busy=false;lastMode='complete';enable(false);world.classList.add('completed');prompt.textContent='כל הכבוד!';hint.textContent='כלב, חתול, ציפור. כל הכבוד מִיָּה!';$('#start').hidden=false;$('#start').textContent='נשחק שוב ↻';$('#pause').hidden=true;lines(['he/praise1','he/praise4'],++run);}
function pause(){if(!active||paused)return;paused=true;++run;stop();enable(false);world.classList.add('paused');$('.pauseveil').hidden=false;}
function resume(){if(!paused)return;paused=false;world.classList.remove('paused');$('.pauseveil').hidden=true;if(wins===3){complete();return;}round=wins;ask();}
const MILLY_FRAMES={base:'milly-base.png?v=1',talk:'milly-talk.png?v=1',happy:'milly-happy.png?v=1',tilt:'milly-tilt.png?v=1',blink:'milly-blink.png?v=1'};
const miliImg=document.getElementById('miliImg');let talkFlip=false;
Object.values(MILLY_FRAMES).forEach(u=>{const i=new Image();i.src=u;});
function miliFrame(){if(lily.classList.contains('walking')||lily.classList.contains('playing'))return miliImg.getAttribute('src');if(lily.classList.contains('happy'))return MILLY_FRAMES.happy;if(lily.classList.contains('tilt'))return MILLY_FRAMES.tilt;if(lily.classList.contains('talking'))return talkFlip?MILLY_FRAMES.talk:MILLY_FRAMES.base;return MILLY_FRAMES.base;}
function miliApply(){miliImg.src=miliFrame();}
new MutationObserver(miliApply).observe(lily,{attributes:true,attributeFilter:['class']});
setInterval(()=>{if(lily.classList.contains('talking')){talkFlip=!talkFlip;miliApply();}},230);
setInterval(()=>{if(!lily.classList.contains('talking')&&!lily.classList.contains('happy')&&!lily.classList.contains('tilt')&&!lily.classList.contains('walking')&&!lily.classList.contains('playing')){miliImg.src=MILLY_FRAMES.blink;setTimeout(()=>{if(miliImg.getAttribute('src')===MILLY_FRAMES.blink)miliApply();},170);}},3700);

$('#start').onclick=start;$('#replay').onclick=()=>{if(paused)return resume();if(!active){const id=++run;lines(['he/praise1','he/praise4'],id);return;}if(lastMode==='intro'){start();return;}if(lastMode==='success')return;ask();};$('#pause').onclick=pause;$('#resume').onclick=resume;document.querySelectorAll('.animal').forEach(b=>b.onclick=()=>choose(b));document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();stop();}});window.addEventListener('pagehide',()=>{++run;stop();});
</script></body></html>
