<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>האנגלית של מיה - שיעור 10</title>
<link rel="stylesheet" href="engine.css?v=1">
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div id="app">
  <div id="topbar">
    <div id="progress" aria-hidden="true">
      <span class="seg" id="seg-learn">🎨</span>
      <span class="seg" id="seg-g1">🎮</span>
      <span class="seg" id="seg-g2">👂</span>
      <span class="seg" id="seg-end">🏆</span>
    </div>
    <div id="starsChip">⭐ <span id="starCount">0</span></div>
    <button id="repeatBtn" title="שמעי שוב" style="visibility:hidden">🔊</button>
  </div>

  <div id="teacherRow">
    <div class="owl" id="owl">
      <div class="body"></div><div class="belly"></div>
      <div class="eye l"><div class="pupil"></div></div>
      <div class="eye r"><div class="pupil"></div></div>
      <div class="beak"></div>
      <div class="wing l"></div><div class="wing r"></div>
      <div class="foot l"></div><div class="foot r"></div>
    </div>
    <div id="bubble">...</div>
  </div>

  <div id="stage"></div>
</div>

<script src="shared-audio.js?v=1"></script>
<script src="shared-games-audio.js?v=1"></script>
<script src="l10audio.js?v=1"></script>
<script src="lessons-data.js?v=1"></script>
